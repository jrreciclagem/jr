<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JR • Fechamento do Contador</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f4f7f8}
    #app{border:0;width:100%;height:100vh;display:block;background:#f4f7f8}
    #loading{font-family:Arial,sans-serif;padding:30px;color:#234}
  </style>
</head>
<body>
<div id="loading">Carregando JR • Fechamento do Contador...</div>
<iframe id="app" title="JR Fechamento do Contador" style="display:none"></iframe>
<script>
(async()=>{
  const src="https://gkilpgtmzhyjwanctfuu.supabase.co/storage/v1/object/public/jr-contador-web/index.html?rev=4";
  try{
    const r=await fetch(src,{cache:"no-store"});
    if(!r.ok) throw new Error("Falha ao carregar a aplicação");
    const html=await r.text();
    const frame=document.getElementById("app");
    frame.srcdoc=html;
    frame.style.display="block";
    document.getElementById("loading").remove();
  }catch(e){
    document.getElementById("loading").textContent="Não foi possível carregar a aplicação. Atualize a página.";
  }
})();
</script>
</body>
</html>
